<template>
  <template lwc:if={isLoading}>
    <div class="loading" aria-label={labels.rdLoading}>
      <span class="bar bar_label"></span><span class="bar bar_value"></span> <span class="bar bar_label"></span
      ><span class="bar bar_value"></span>
    </div>
  </template>
  <template lwc:elseif={error}>
    <div class="error" role="alert">
      <div class="error-illustration">
        <lightning-illustration illustration-name={errorIllustrationName}></lightning-illustration>
      </div>
      <div>
        <p class="error-title">{failedText}</p>
        <p class="message">{error.message}</p>
      </div>
    </div>
  </template>
  <template lwc:elseif={hasFields}>
    <dl class="facts">
      <template for:each={fields} for:item="field">
        <div key={field.key} class="fact">
          <dt class="fact-label">{field.label}</dt>
          <dd class="fact-value">{field.value}</dd>
        </div>
      </template>
    </dl>
  </template>
  <template lwc:else>
    <p class="message">{labels.rdNoFields}</p>
  </template>
</template>
