<template>
  <div class="diag">
    <header class="head">
      <h1 class="title">Diagnostics</h1>
      <p class="lede">
        Enter a Contact or Account Id. The timeline draws as it does on a record page, and the tabs show how it is set
        up, how long it took and why, and what it drew.
      </p>
    </header>

    <section class="panel" aria-labelledby="diag-form">
      <h2 class="panel-title" id="diag-form">Run it</h2>
      <div class="form">
        <lightning-input
          class="form-id"
          label="Contact or Account Id"
          placeholder="003… or 001…"
          value={recordId}
          maxlength="18"
          onchange={handleId}
          onkeydown={handleKey}
        ></lightning-input>
        <lightning-combobox
          label="Layout"
          value={layout}
          options={layoutOptions}
          onchange={handleLayout}
        ></lightning-combobox>
        <lightning-combobox
          label="History"
          value={history}
          options={historyOptions}
          onchange={handleHistory}
        ></lightning-combobox>
        <lightning-combobox
          label="Future"
          value={future}
          options={futureOptions}
          onchange={handleFuture}
        ></lightning-combobox>
      </div>
      <div class="actions">
        <lightning-button
          class="run-load"
          variant="brand"
          label={runLabel}
          disabled={cannotRun}
          onclick={runLoad}
        ></lightning-button>
        <span class="hint">The timeline's opening request, as a record page makes it.</span>
      </div>
      <p class="error" role="alert" lwc:if={error}>{error}</p>
    </section>

    <div class="tabs" role="tablist" aria-label="Diagnostics" onkeydown={handleTabKey}>
      <template for:each={tabs} for:item="t">
        <button
          key={t.key}
          type="button"
          role="tab"
          class={t.className}
          data-tab={t.key}
          aria-selected={t.ariaSelected}
          tabindex={t.tabindex}
          onclick={handleTab}
        >
          {t.label}
        </button>
      </template>
    </div>

    <!-- Config: what the settings are -->
    <div class="tabpanel tabpanel_config" role="tabpanel" aria-label="Config" lwc:if={isConfig}>
      <template lwc:if={hasReport}>
        <section class="panel" data-panel="sources">
          <h2 class="panel-title">Data sources for this page ({usedCount} used)</h2>
          <div class="scroll">
            <table class="grid sources">
              <thead>
                <tr>
                  <th scope="col">Source</th>
                  <th scope="col">Status</th>
                  <th scope="col">Why</th>
                  <th scope="col">What the user may do with the object</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={sources} for:item="s">
                  <tr key={s.key} class={s.className}>
                    <td>
                      <strong>{s.label}</strong>
                      <span class="sub">{s.developerName} · {s.kind} · {s.objectName}</span>
                    </td>
                    <td><span class={s.statusClass}>{s.statusText}</span></td>
                    <td class="reason">{s.reason}</td>
                    <td>
                      <span lwc:if={s.access}>{s.access}</span>
                      <span class="sub sub_bad" lwc:if={s.missingText}
                        >No access, or no such field: {s.missingText}</span
                      >
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <div class="two">
          <section class="panel" data-panel="page">
            <h2 class="panel-title">The page</h2>
            <dl class="facts">
              <template for:each={page} for:item="f">
                <div key={f.key} class="fact">
                  <dt>{f.label}</dt>
                  <dd><span class={f.valueClass}>{f.value}</span><span class="sub">{f.detail}</span></dd>
                </div>
              </template>
            </dl>
          </section>
          <section class="panel" data-panel="permissions">
            <h2 class="panel-title">The user and their permissions</h2>
            <dl class="facts">
              <template for:each={permissions} for:item="f">
                <div key={f.key} class="fact">
                  <dt>{f.label}</dt>
                  <dd><span class={f.valueClass}>{f.value}</span><span class="sub">{f.detail}</span></dd>
                </div>
              </template>
            </dl>
          </section>
        </div>
      </template>
      <p class="none panel" lwc:else>Run the timeline to see its sources and the user's permissions.</p>
    </div>

    <!-- Performance: how long it took, and why -->
    <div class="tabpanel tabpanel_performance" role="tabpanel" aria-label="Performance" lwc:if={isPerformance}>
      <section class="panel" data-panel="speed">
        <h2 class="panel-title">How long it took</h2>
        <ul class="bigs">
          <template for:each={headline} for:item="h">
            <li key={h.key} class={h.className}>
              <span class="big-label">{h.label}</span>
              <span class="big-value">{h.value}</span>
              <span class="big-note">{h.note}</span>
            </li>
          </template>
        </ul>
        <template lwc:if={hasShares}>
          <div class="bar" role="img" aria-label="Where the wait went">
            <template for:each={shares} for:item="b">
              <span key={b.key} class={b.className} style={b.style}></span>
            </template>
          </div>
          <ul class="legend">
            <template for:each={shares} for:item="b">
              <li key={b.key}><span class={b.legendClass}></span>{b.label}: <strong>{b.ms}</strong></li>
            </template>
          </ul>
          <p class="sentence">{sentence}</p>
        </template>
        <ul class="problems" lwc:if={hasProblems}>
          <template for:each={problems} for:item="p">
            <li key={p.key}>{p.text}</li>
          </template>
        </ul>
      </section>

      <template lwc:if={hasPerf}>
        <section class="panel" data-panel="queries">
          <h2 class="panel-title">Queries run ({queries.length}, {queryTotal} ms in all)</h2>
          <template lwc:if={hasQueries}>
            <div class="scroll">
              <table class="grid queries">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Source</th>
                    <th scope="col">Kind</th>
                    <th scope="col" class="num">Started (ms)</th>
                    <th scope="col" class="num">Took (ms)</th>
                    <th scope="col" class="num">Rows</th>
                    <th scope="col">SOQL as run</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={queries} for:item="q">
                    <tr key={q.key} class={q.className}>
                      <td>{q.seq}</td>
                      <td>{q.source}</td>
                      <td>{q.kind}</td>
                      <td class="num">{q.startedMs}</td>
                      <td class="num">{q.ms}</td>
                      <td class="num">{q.rowsText}</td>
                      <td class="soql-cell">
                        <details>
                          <summary class="soql-short">{q.short}</summary>
                          <pre class="soql">{q.soql}</pre>
                          <p class="binds"><strong>Binds:</strong> {q.binds}</p>
                          <p class="query-error" lwc:if={q.error}><strong>Error:</strong> {q.error}</p>
                        </details>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <p class="none" lwc:else>No query ran.</p>
        </section>

        <section class="panel" data-panel="by-source">
          <h2 class="panel-title">Time by source</h2>
          <div class="scroll">
            <table class="grid by-source">
              <thead>
                <tr>
                  <th scope="col">Source</th>
                  <th scope="col">How</th>
                  <th scope="col" class="num">Queries</th>
                  <th scope="col" class="num">Query ms</th>
                  <th scope="col" class="num">Rows</th>
                  <th scope="col" class="num">Source ms</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={bySource} for:item="s">
                  <tr key={s.key} class={s.className}>
                    <td><strong>{s.label}</strong></td>
                    <td>{s.how}</td>
                    <td class="num">{s.queries}</td>
                    <td class="num">{s.queryMs}</td>
                    <td class="num">{s.rows}</td>
                    <td class="num">{s.sourceMs}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <p class="hint">Source ms is the time a source took to count, or to read and plot, including its queries.</p>
        </section>

        <section class="panel" data-panel="notes" lwc:if={hasNotes}>
          <h2 class="panel-title">Left out, or done differently</h2>
          <ul class="notes">
            <template for:each={notes} for:item="n">
              <li key={n.key}><strong>{n.what}</strong> · {n.source}<span class="sub">{n.reason}</span></li>
            </template>
          </ul>
        </section>

        <section class="panel" data-panel="stats">
          <h2 class="panel-title">The server's run in numbers</h2>
          <ul class="tiles">
            <template for:each={stats} for:item="t">
              <li key={t.key} class="tile">
                <span class="tile-label">{t.label}</span>
                <span class="tile-value">{t.value}</span>
              </li>
            </template>
          </ul>
        </section>
      </template>

      <section class="panel" data-panel="browser" lwc:if={hasBrowserLines}>
        <details class="trace">
          <summary>Everything the card logged ({lines.length} lines)</summary>
          <ol class="trace-lines">
            <template for:each={browserLines} for:item="l">
              <li key={l.key}><span class="trace-at">{l.at} ms</span> {l.text}</li>
            </template>
          </ol>
        </details>
      </section>
    </div>

    <!-- Output: the timeline itself. Drawn whichever tab is showing, so its
         load is timed as it really is. -->
    <div class={outputClass} role="tabpanel" aria-label="Output" aria-hidden={outputHidden}>
      <template lwc:if={hasTimeline}>
        <section class="panel timeline" data-panel="timeline">
          <p class="summary" lwc:if={outputSummary}>{outputSummary}</p>
          <c-time-drive
            record-id={drawnFor}
            layout={cardLayout}
            history-years={history}
            future-years={future}
            card-title="Diagnostics timeline"
            diagnose={diagnoseCard}
          ></c-time-drive>
        </section>
      </template>
      <p class="none panel" lwc:else>Run the timeline to see its output here.</p>
    </div>
  </div>
</template>
