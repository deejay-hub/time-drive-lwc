<template>
  <template for:each={parts} for:item="t">
    <template lwc:if={t.isLink}>
      <a
        key={t.key}
        class="doc-link"
        href={t.href}
        target={t.target}
        rel={t.rel}
        data-doc={t.doc}
        data-anchor={t.anchor}
        onclick={handleLink}
        >{t.text}</a
      >
    </template>
    <template lwc:elseif={t.code}>
      <code key={t.key} class="doc-code">{t.text}</code>
    </template>
    <template lwc:elseif={t.bold}>
      <strong key={t.key} class="doc-strong">{t.text}</strong>
    </template>
    <template lwc:elseif={t.italic}>
      <em key={t.key}>{t.text}</em>
    </template>
    <template lwc:else>
      <span key={t.key}>{t.text}</span>
    </template>
  </template>
</template>
