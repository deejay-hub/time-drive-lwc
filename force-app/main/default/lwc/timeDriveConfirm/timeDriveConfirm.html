<template>
  <lightning-modal-header label={title}></lightning-modal-header>
  <lightning-modal-body>
    <p class="message">{message}</p>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button label={cancelLabel} onclick={handleCancel}></lightning-button>
    <lightning-button class="confirm" variant="brand" label={confirmLabel} onclick={handleConfirm}></lightning-button>
  </lightning-modal-footer>
</template>
