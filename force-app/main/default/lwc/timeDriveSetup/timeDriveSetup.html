                    </div>
                  </template>

                  <!-- Words: the title and subtitle, with fields -->
                  <!-- Words and style: what each item says, its icon and colour, on one sample item -->
                  <template lwc:if={isLookStep}>
                    <div class="sample sample_large">
                      <span class="node node_large" style={nodeStyle} aria-hidden="true">
                        <lightning-icon icon-name={iconName} size="small" variant="inverse"></lightning-icon>
                      </span>
                      <div class="sample-body">
                        <span class="sample-text" aria-hidden="true">
                          <span class="sample-title">
                            <template for:each={titleParts} for:item="p">
                              <span key={p.key} class={p.className}>{p.text}</span>
                            </template>
                          </span>
                          <span class="sample-sub">
                            <template lwc:if={showWords}>
                              <template for:each={subtitleParts} for:item="p">
                                <span key={p.key} class={p.className}>{p.text}</span>
                              </template>
                            </template>
                            <template lwc:else>
                              <lightning-formatted-date-time
                                value={sampleDate}
                                day="numeric"
                                month="short"
                                hour="2-digit"
                                minute="2-digit"
                              ></lightning-formatted-date-time>
                            </template>
                          </span>
                        </span>

                        <template lwc:if={showWords}>
                          <div class="word-fields">
                            <div class="word-field">
                              <span class="word-label" id="title-label">Title</span>
                              <div class="word-row">
                                <button
                                  class="field-choice"
                                  type="button"
                                  data-field="title"
                                  aria-labelledby="title-label title-choice"
                                  aria-expanded={titleTokensOpen}
                                  disabled={cannotChooseTitleField}
                                  onclick={handleTokenOpen}
                                >
                                  <span id="title-choice" class={titleChoiceClass}>{titleChoice}</span>
                                  <lightning-icon icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
                                </button>
                                <button
                                  lwc:if={canClearTitle}
                                  class="field-clear"
                                  type="button"
                                  data-field="title"
                                  title="Show its name instead"
                                  aria-label="Take the field off the title"
                                  onclick={handleFieldClear}
                                >
                                  <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                </button>
                              </div>
                              <p lwc:if={titleCutNote} class="word-note">{titleCutNote}</p>
                              <template lwc:if={titleTokensOpen}>
                                <c-time-drive-field-picker
                                  fields={tokenFields}
                                  label="Search fields for the title"
                                  onpick={handleFieldPick}
                                  onclose={handleFieldPickClose}
                                ></c-time-drive-field-picker>
                              </template>
                            </div>

                            <div class="word-field">
                              <span class="word-label" id="subtitle-label">Subtitle</span>
                              <div class="word-row">
                                <button
                                  class="field-choice"
                                  type="button"
                                  data-field="subtitle"
                                  aria-labelledby="subtitle-label subtitle-choice"
                                  aria-describedby="subtitle-note"
                                  aria-expanded={subtitleTokensOpen}
                                  disabled={cannotChooseSubtitleField}
                                  onclick={handleTokenOpen}
                                >
                                  <span id="subtitle-choice" class={subtitleChoiceClass}>{subtitleChoice}</span>
                                  <lightning-icon
                                    lwc:if={canAddSubtitleChoice}
                                    icon-name="utility:chevrondown"
                                    size="xx-small"
                                  ></lightning-icon>
                                </button>
                                <button
                                  lwc:if={canClearSubtitle}
                                  class="field-clear"
                                  type="button"
                                  data-field="subtitle"
                                  title="No subtitle"
                                  aria-label="Take the field off the subtitle"
                                  onclick={handleFieldClear}
                                >
                                  <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                </button>
                              </div>
                              <!-- A second field, read after a dot: Assigned To · Related To. -->
                              <div lwc:if={showSubtitleSecond} class="word-row word-row_second">
                                <span class="word-dot" aria-hidden="true">·</span>
                                <button
                                  class="field-choice"
                                  type="button"
                                  data-field="subtitle2"
                                  aria-label={subtitleSecondLabel}
                                  aria-expanded={subtitleSecondTokensOpen}
                                  onclick={handleTokenOpen}
                                >
                                  <span class={subtitleSecondChoiceClass}>{subtitleSecondChoice}</span>
                                  <lightning-icon icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
                                </button>
                                <button
                                  lwc:if={canClearSubtitleSecond}
                                  class="field-clear"
                                  type="button"
                                  data-field="subtitle2"
                                  title="No second field"
                                  aria-label="Take the second field off the subtitle"
                                  onclick={handleFieldClear}
                                >
                                  <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                </button>
                              </div>
                              <template lwc:if={subtitleSecondTokensOpen}>
                                <c-time-drive-field-picker
                                  fields={tokenFields}
                                  label="Search fields for the subtitle's second field"
                                  onpick={handleFieldPick}
                                  onclose={handleFieldPickClose}
                                ></c-time-drive-field-picker>
                              </template>
                              <p lwc:if={isEmailMessage} id="subtitle-note" class="word-note">
                                Set for you: who each email went to.
                              </p>
                              <p lwc:if={subtitleCutNote} class="word-note">{subtitleCutNote}</p>
                              <template lwc:if={subtitleTokensOpen}>
                                <c-time-drive-field-picker
                                  fields={tokenFields}
                                  label="Search fields for the subtitle"
                                  onpick={handleFieldPick}
                                  onclose={handleFieldPickClose}
                                ></c-time-drive-field-picker>
                              </template>
                            </div>
                          </div>
                        </template>
                        <template lwc:if={canRestoreLook}>
                          <div class="look-restore">
                            <lightning-button
                              variant="base"
                              icon-name="utility:undo"
                              label={restoreLookLabel}
                              onclick={handleRestoreLook}
                            ></lightning-button>
                          </div>
                        </template>
                      </div>
                    </div>
                    <div class={styleGridClass}>
                      <div class="look">
                        <section class="look-panel" aria-labelledby="icon-question">
                          <div class="look-head">
                            <h3 class="second-question" id="icon-question">Icon</h3>
                            <span class="look-current">{iconCurrentText}</span>
                          </div>
                          <div class="look-search">
                            <lightning-icon
                              class="picker-glass"
                              icon-name="utility:search"
                              size="x-small"
                              aria-hidden="true"
                            ></lightning-icon>
                            <input
                              class="look-input"
                              type="search"
                              aria-label="Search the SLDS icons"
                              placeholder="Search icons: email, money, chat…"
                              autocomplete="off"
                              spellcheck="false"
                              value={iconQuery}
                              oninput={handleIconQuery}
                            />
                          </div>
                          <div class="look-sets" role="group" aria-label="Icon set">
                            <template for:each={iconSets} for:item="set">
                              <button
                                key={set.key}
                                class={set.className}
                                type="button"
                                aria-pressed={set.pressed}
                                data-value={set.key}
                                onclick={handleIconSet}
                              >
                                {set.text}
                              </button>
                            </template>
                          </div>
                          <p class="quiet look-count" aria-live="polite">{iconCountText}</p>
                          <div class="icons" role="group" aria-label="Icons" onscroll={handleIconScroll}>
                            <template for:each={iconChoices} for:item="i">
                              <button
                                key={i.name}
                                class={i.className}
                                type="button"
                                aria-pressed={i.pressed}
                                title={i.label}
                                data-value={i.name}
                                onclick={handleIcon}
                              >
                                <lightning-icon
                                  icon-name={i.name}
                                  size="small"
                                  alternative-text={i.label}
                                ></lightning-icon>
                              </button>
                            </template>
                          </div>
                        </section>

                        <section class="look-panel" aria-labelledby="colour-question">
                          <div class="look-head">
                            <h3 class="second-question" id="colour-question">Colour</h3>
                            <span class="look-current">{colourText}</span>
                          </div>
                          <div class="palette" role="group" aria-label="SLDS colours">
                            <template for:each={paletteRows} for:item="row">
                              <div key={row.key} class="palette-row">
                                <span class="palette-hue">{row.hue}</span>
                                <template for:each={row.swatches} for:item="c">
                                  <button
                                    key={c.key}
                                    class={c.className}
                                    style={c.style}
                                    type="button"
                                    aria-pressed={c.pressed}
                                    title={c.label}
                                    data-value={c.value}
                                    onclick={handleColour}
                                  >
                                    <span class="slds-assistive-text">{c.label}</span>
                                  </button>
                                </template>
                              </div>
                            </template>
                          </div>
                          <div class="look-custom">
                            <lightning-input
                              type="color"
                              label="Any colour"
                              value={customColour}
                              onchange={handleCustomColour}
                            ></lightning-input>
                          </div>
                        </section>
                      </div>
                    </div>
                  </template>

                  <!-- Details: what an opened item shows, beside a preview with sample values -->
                  <template lwc:if={isOpenStep}>
                    <div class="behave">
                      <div class="behave-choose">
                        <p lwc:if={isSalesforce} class="behave-heading">When it is opened</p>
                        <div class="details-box">
                          <p class="details-title">Fields to show, in order</p>
                          <ul class="details">
                            <template for:each={detailRows} for:item="d">
                              <li key={d.key} class="detail">
                                <template lwc:if={isApex}>
                                  <lightning-input
                                    class="detail-field"
                                    label="Field"
                                    variant="label-hidden"
                                    placeholder="Value name, as the class returns it"
                                    value={d.field}
                                    data-index={d.index}
                                    data-part="field"
                                    onchange={handleDetailChange}
                                  ></lightning-input>
                                </template>
                                <template lwc:else>
                                  <div class="detail-pick">
                                    <button
                                      class="detail-field detail-field_button"
                                      type="button"
                                      data-index={d.index}
                                      aria-expanded={d.pickerOpen}
                                      onclick={handleDetailPickOpen}
                                    >
                                      <span class={d.fieldClass}>{d.fieldText}</span>
                                      <lightning-icon icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
                                    </button>
                                    <template lwc:if={d.pickerOpen}>
                                      <c-time-drive-field-picker
                                        fields={tokenFields}
                                        label="Search fields to show"
                                        onpick={handleFieldPick}
                                        onclose={handleFieldPickClose}
                                      ></c-time-drive-field-picker>
                                    </template>
                                  </div>
                                </template>
                                <lightning-combobox
                                  dropdown-alignment="auto"
                                  class="detail-format"
                                  label="Shown as"
                                  variant="label-hidden"
                                  options={formatOptions}
                                  value={d.format}
                                  data-index={d.index}
                                  data-part="format"
                                  onchange={handleDetailChange}
                                ></lightning-combobox>
                                <span class="detail-actions">
                                  <template lwc:if={canReorderDetails}>
                                    <lightning-button-icon
                                      icon-name="utility:chevronup"
                                      variant="bare"
                                      size="small"
                                      alternative-text={d.upLabel}
                                      title={d.upLabel}
                                      disabled={d.first}
                                      data-index={d.index}
                                      data-dir="-1"
                                      onclick={handleMoveDetail}
                                    ></lightning-button-icon>
                                    <lightning-button-icon
                                      icon-name="utility:chevrondown"
                                      variant="bare"
                                      size="small"
                                      alternative-text={d.downLabel}
                                      title={d.downLabel}
                                      disabled={d.last}
                                      data-index={d.index}
                                      data-dir="1"
                                      onclick={handleMoveDetail}
                                    ></lightning-button-icon>
                                  </template>
                                  <lightning-button-icon
                                    icon-name="utility:close"
                                    variant="bare"
                                    alternative-text={d.removeLabel}
                                    title={d.removeLabel}
                                    data-index={d.index}
                                    onclick={handleRemoveDetail}
                                  ></lightning-button-icon>
                                </span>
                              </li>
                            </template>
                          </ul>
                          <template lwc:if={canAddDetail}>
                            <lightning-button
                              variant="base"
                              icon-name="utility:add"
                              label="Add a field"
                              onclick={handleAddDetail}
                            ></lightning-button>
                          </template>
                          <template lwc:else>
                            <p class="hint">
                              Up to {maxDetails} fields, besides the title and subtitle. Long text shows its first
                              {detailChars} characters; rich text shows as plain words.
                            </p>
                          </template>
                        </div>
                        <template lwc:if={isSalesforce}>
                          <p class="behave-heading behave-heading_next">When its title is clicked</p>
                          <template lwc:if={clickFocused}>
                            <div class="link-chosen">
                              <div class="option option_on option_chosen">
                                <span class="option-icon"
                                  ><lightning-icon icon-name={chosenClick.icon} size="small"></lightning-icon
                                ></span>
                                <span class="option-text">
                                  <span class="option-label">{chosenClick.title}</span>
                                  <span class="option-detail">{chosenClick.text}</span>
                                </span>
                                <template lwc:if={clickChangeable}>
                                  <lightning-button-icon
                                    class="link-close"
                                    icon-name="utility:close"
                                    variant="bare"
                                    alternative-text="Show every option"
                                    title="Show every option"
                                    onclick={handleClickChange}
                                  ></lightning-button-icon>
                                </template>
                              </div>
                            </div>
                          </template>
                          <div class={clickOptionsClass} role="radiogroup" aria-label="What a click opens">
                            <template for:each={clickOptions} for:item="o">
                              <button
                                key={o.value}
                                class={o.className}
                                type="button"
                                role="radio"
                                aria-checked={o.checked}
                                data-value={o.value}
                                disabled={o.disabled}
                                onclick={handleClickChoice}
                              >
                                <span class="option-icon"
                                  ><lightning-icon icon-name={o.icon} size="small"></lightning-icon
                                ></span>
                                <span class="option-text">
                                  <span class="option-label">{o.title}</span>
                                  <span class="option-detail">{o.text}</span>
                                </span>
                              </button>
                            </template>
                          </div>
                          <template lwc:if={isClickRelated}>
                            <div class="behave-related">
                              <p class="behave-label">Which record?</p>
                              <div class="look-sets" role="group" aria-label="Which record?">
                                <template for:each={clickLookupChips} for:item="c">
                                  <button
                                    key={c.key}
                                    class={c.className}
                                    type="button"
                                    aria-pressed={c.pressed}
                                    data-value={c.value}
                                    onclick={handleClickLookup}
                                  >
                                    {c.text}
                                  </button>
                                </template>
                              </div>
                            </div>
                          </template>
                        </template>
                        <template lwc:if={canHighlight}>
                          <p class="behave-heading behave-heading_next">Highlights</p>
                          <p class="behave-label">{highlightHelp}</p>
                          <ul class="highlights">
                            <template for:each={highlightRows} for:item="h">
                              <li key={h.key} class="highlight">
                                <div class="highlight-head">
                                  <!-- An Apex source has no fields to list: its key, typed. -->
                                  <template lwc:if={isApex}>
                                    <lightning-input
                                      class="highlight-field"
                                      label="Field or key"
                                      variant="label-hidden"
                                      placeholder="A checkbox field (Flagged__c) or a map key"
                                      value={h.field}
                                      data-index={h.index}
                                      onchange={handleHighlightField}
                                    ></lightning-input>
                                  </template>
                                  <template lwc:else>
                                    <lightning-combobox
                                      dropdown-alignment="auto"
                                      class="highlight-field"
                                      label="Field"
                                      variant="label-hidden"
                                      placeholder="Choose a field"
                                      options={highlightFieldOptions}
                                      value={h.field}
                                      data-index={h.index}
                                      onchange={handleHighlightField}
                                    ></lightning-combobox>
                                  </template>
                                  <lightning-button-icon
                                    icon-name="utility:close"
                                    variant="bare"
                                    alternative-text={h.removeLabel}
                                    title={h.removeLabel}
                                    data-index={h.index}
                                    onclick={handleRemoveHighlight}
                                  ></lightning-button-icon>
                                </div>
                                <template lwc:if={h.field}>
                                  <div class="highlight-icons" role="group" aria-label="Icon">
                                    <template for:each={h.iconChoices} for:item="i">
                                      <button
                                        key={i.key}
                                        class={i.className}
                                        type="button"
                                        aria-pressed={i.pressed}
                                        title={i.label}
                                        data-index={h.index}
                                        data-value={i.value}
                                        onclick={handleHighlightIcon}
                                      >
                                        <template lwc:if={i.isDot}
                                          ><span class="highlight-dot" style={h.colourStyle}></span
                                        ></template>
                                        <template lwc:else
                                          ><lightning-icon icon-name={i.value} size="x-small"></lightning-icon
                                        ></template>
                                        <span class="slds-assistive-text">{i.label}</span>
                                      </button>
                                    </template>
                                  </div>
                                  <div class="highlight-colours" role="group" aria-label="Colour">
                                    <template for:each={h.colourChoices} for:item="c">
                                      <button
                                        key={c.key}
                                        class={c.className}
                                        style={c.style}
                                        type="button"
                                        aria-pressed={c.pressed}
                                        title={c.label}
                                        data-index={h.index}
                                        data-value={c.value}
                                        onclick={handleHighlightColour}
                                      >
                                        <span class="slds-assistive-text">{c.label}</span>
                                      </button>
                                    </template>
                                  </div>
                                </template>
                              </li>
                            </template>
                          </ul>
                          <template lwc:if={canAddHighlight}>
                            <lightning-button
                              variant="base"
                              icon-name="utility:add"
                              label="Add a highlight"
                              onclick={handleAddHighlight}
                            ></lightning-button>
                          </template>
                        </template>
                      </div>
                      <figure class="mock">
                        <figcaption class="mock-caption">
                          <span class="mock-badge">Sample values</span>
                          <span>{previewSourceNote}</span>
                        </figcaption>
                        <div class="mock-item mock-item_open">
                          <div class="mock-row">
                            <span class="mock-chevron" aria-hidden="true">
                              <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
                            </span>
                            <span class="node" style={nodeStyle}>
                              <lightning-icon icon-name={iconName} size="xx-small" variant="inverse"></lightning-icon>
                            </span>
                            <span class="mock-main">
                              <span class="mock-title-line"
                                ><span class={mockTitleClass}>{previewTitle}</span
                                ><template for:each={previewFlags} for:item="f"
                                  ><span key={f.key} class="mock-flag" style={f.style} title={f.text}
                                    ><template lwc:if={f.isDot}><span class="highlight-dot"></span></template
                                    ><template lwc:else
                                      ><lightning-icon
                                        icon-name={f.icon}
                                        size="xx-small"
                                      ></lightning-icon></template></span></template
                              ></span>
                              <span lwc:if={previewSubtitle} class="mock-sub">{previewSubtitle}</span>
                            </span>
                            <span class="mock-time">{previewTime}</span>
                          </div>
                          <div class="mock-detail">
                            <template lwc:if={previewLoading}>
                              <span class="mock-line"></span>
                              <span class="mock-line"></span>
                              <span class="mock-line mock-line_short"></span>
                            </template>
                            <template lwc:elseif={previewEmpty}>
                              <p class="mock-empty">{previewEmptyText}</p>
                            </template>
                            <template lwc:else>
                              <dl class="mock-facts">
                                <template for:each={previewFacts} for:item="f">
                                  <div key={f.key} class="mock-fact">
                                    <dt>{f.label}</dt>
                                    <dd>{f.value}</dd>
                                  </div>
                                </template>
                              </dl>
                            </template>
                          </div>
                        </div>
                        <template lwc:if={isSalesforce}>
                          <div class="mock-arrow" aria-hidden="true">
                            <lightning-icon icon-name="utility:arrowdown" size="x-small"></lightning-icon>
                          </div>
                          <div class="mock-page">
                            <div class={clickPageHeadClass}>
                              <span class="mock-page-icon"
                                ><lightning-icon
                                  icon-name="utility:record"
                                  size="x-small"
                                  variant="inverse"
                                ></lightning-icon
                              ></span>
                              <span class="mock-page-text">
                                <span class="mock-page-object">{clickPageLabel}</span>
                                <span class="mock-page-name">{clickPageName}</span>
                              </span>
                            </div>
                          </div>
                        </template>
                      </figure>
                    </div>
                  </template>

                  <!-- The last question also holds Active and Save's messages -->
                  <template lwc:if={isLastStep}>
                    <lightning-input
                      class="switch-on"
                      type="toggle"
                      label="Active when saved"
                      message-toggle-active=""
                      message-toggle-inactive=""
                      checked={draft.active}
                      disabled={saving}
                      onchange={handleActive}
                    ></lightning-input>

                    <p class="quiet" lwc:if={missingAnswers}>{missingAnswers}</p>
                    <template lwc:if={saveError}>
                      <div class="notice notice_error" role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                        <div>
                          <p class="notice-title">{saveError.message}</p>
                          <p lwc:if={saveError.cause}>{saveError.cause}</p>
                        </div>
                      </div>
                    </template>
                  </template>
                </div>
              </template>
            </div>
            <aside class="wz-aside" aria-labelledby="sofar-title">
              <div class="aside-panel">
                <h2 class="aside-title" id="sofar-title">So far</h2>
                <template lwc:if={hasSoFar}>
                  <dl class="sofar">
                    <template for:each={soFar} for:item="a">
                      <div key={a.key} class="sofar-row">
                        <dt>{a.name}</dt>
                        <dd>
                          <button class="sofar-answer" type="button" data-step={a.step} onclick={handleKnot}>
                            {a.answer}
                          </button>
                        </dd>
                      </div>
                    </template>
                  </dl>
                </template>
                <template lwc:else>
                  <p class="quiet">Your answers collect here as you go. Any of them is a click away.</p>
                </template>
              </div>
            </aside>
          </div>

          <footer class="wz-foot">
            <button class="ghost" type="button" onclick={handleBack} disabled={backDisabled}>
              <lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon>
              <span>Back</span>
            </button>
            <span class="foot-hint">
              <span class="foot-step">{stepCountText}</span>
              <span lwc:if={blockedReason}>{blockedReason}</span>
            </span>
            <template lwc:if={isLastStep}>
              <button class={saveClass} type="button" disabled={saveDisabled} onclick={handleSave}>
                <span class="save-icon"
                  ><lightning-icon icon-name={saveIcon} size="x-small" variant="inverse"></lightning-icon
                ></span>
                <span>{saveLabel}</span>
              </button>
            </template>
            <template lwc:else>
              <button class="primary" type="button" disabled={continueDisabled} onclick={handleContinue}>
                <span>Next</span>
                <lightning-icon icon-name="utility:chevronright" size="x-small" variant="inverse"></lightning-icon>
              </button>
            </template>
          </footer>
        </section>
      </template>
    </div>
  </div>
</template>
