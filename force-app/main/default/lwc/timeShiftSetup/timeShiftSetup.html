              <template lwc:if={c.current}>
                <span class="crumb-here" aria-current={c.ariaCurrent}>{c.label}</span>
              </template>
              <template lwc:else>
                <button class="crumb-link" type="button" data-to={c.to} onclick={handleCrumb}>{c.label}</button>

                  class="crumb-sep"

                  size="xx-small"
                  aria-hidden="true"

                <p lwc:if={loadError.cause}>{loadError.cause}</p>

                                <span class="chip chip_tiny" style={cell.chipStyle}>
                                  <lightning-icon
                                    icon-name={cell.iconName}
                                    size="xx-small"
                                    variant="inverse"
                                  ></lightning-icon>
                                </span>
                                <span class="kd-cell-text">{cell.label}</span>
                              </span>
                            </template>
                            <template lwc:else>{cell.label}</template>
                          </td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </section>

            <div class="kd-grid">
              <article class="kd-card" aria-labelledby="dash-on">
                <h2 class="kd-card-title" id="dash-on">Sources on</h2>
                <p class="kd-figure">
                  <span class="kd-number">{onCount}</span>
                  <span class="kd-of">of {sourceTotal}</span>
                </p>
                <div class="kd-meter" aria-hidden="true"><span class="kd-meter-fill" style={meterStyle}></span></div>
                <p class="kd-note">{offNote}</p>
              </article>

              <article class="kd-card" aria-labelledby="dash-kinds">
                <h2 class="kd-card-title" id="dash-kinds">By kind</h2>
                <ul class="kd-bars">
                  <template for:each={kindBars} for:item="k">
                    <li key={k.key} class="kd-bar">
                      <span class="kd-bar-label">{k.label}</span>
                      <span class="kd-bar-count">{k.count}</span>
                      <span class="kd-bar-track" aria-hidden="true"
                        ><span class="kd-bar-fill" style={k.style}></span
                      ></span>
                    </li>
                  </template>
                </ul>
              </article>

              <article class="kd-card" aria-labelledby="dash-pages">
                <h2 class="kd-card-title" id="dash-pages">Record pages</h2>
                <ul class="kd-list">
                  <template for:each={glanceRows} for:item="g">
                    <li key={g.key}>
                      <button
                        class="kd-row"
                        type="button"
                        data-value={g.value}
                        aria-label={g.openLabel}
                        onclick={handleParentCard}
                      >
                        <span class="kd-row-text">
                          <span class="kd-row-name">{g.label}</span>
                          <span class="kd-row-detail">{g.detail}</span>
                        </span>
                        <span class={g.pillClass}><span class="pill-dot" aria-hidden="true"></span>{g.pill}</span>
                      </button>
                    </li>
                  </template>
                  <li class="kd-row kd-row_soon">
                    <span class="kd-row-text">
                      <span class="kd-row-name">More record pages</span>
                      <span class="kd-row-detail">Other record pages are planned.</span>
                    </span>
                  </li>
                </ul>
              </article>

              <article class="kd-card" aria-labelledby="dash-off">
                <h2 class="kd-card-title" id="dash-off">Switched off</h2>
                <template lwc:if={hasOffSources}>
                  <ul class="kd-list">
                    <template for:each={offSources} for:item="o">
                      <li key={o.developerName}>
                        <button
                          class="kd-row"
                          type="button"
                          data-name={o.developerName}
                          aria-label={o.openLabel}
                          onclick={handleOpenSource}
                        >
                          <span class="chip chip_small" style={o.chipStyle}>
                            <lightning-icon icon-name={o.iconName} size="xx-small" variant="inverse"></lightning-icon>
                          </span>
                          <span class="kd-row-text">
                            <span class="kd-row-name">{o.label}</span>
                            <span class="kd-row-detail">{o.where}</span>
                          </span>
                          <span class="pill pill_off">Inactive</span>
                        </button>
                      </li>
                    </template>
                  </ul>
                </template>
                <template lwc:else>
                  <p class="kd-note">Every source is active.</p>
                </template>
              </article>
            </div>
          </section>
        </div>
      </template>

      <!-- Setup: guided steps, each with what to do and a way to do it -->
      <template lwc:elseif={isSetupPage}>
        <header class="page-head page-head_split">
          <div class="page-head-text">
            <h1 class="page-title" tabindex="-1">Guided setup</h1>
            <p class="page-lede">
              Everything Time Trail needs, in order. Each step says what to do and takes you there.
            </p>
          </div>
        </header>

        <template lwc:if={loadError}>
          <div class="notice notice_error guided-access" role="alert">
            <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
            <div>
              <p class="notice-title">{loadError.message}</p>
              <p>Managing timeline sources needs the Customize Application permission: sources are custom metadata.</p>
            </div>
            <button class="ghost" type="button" data-handler="retry" onclick={handleGuidedAction}>Check again</button>
          </div>
        </template>
        <div class={guidedProgressClass} role="group" aria-label="Progress">
          <p class="guided-count" role="status">
            <template lwc:if={guidedAllDone}>
              <span class="guided-count-mark" aria-hidden="true">
                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
              </span>
              <span class="guided-count-number">Setup complete</span>
              <span class="guided-count-label">{guidedAllDoneText}</span>
            </template>
            <template lwc:else>
              <span class="guided-count-number">{guidedProgressText}</span>
              <span class="guided-count-label">steps done</span>
            </template>
          </p>
          <ol class="guided-bar">
            <template for:each={guidedSegments} for:item="seg">
              <li key={seg.key} class={seg.className} title={seg.label}>
                <span class="slds-assistive-text">{seg.label}</span>
              </li>
            </template>
          </ol>
        </div>

        <div class="guided">
          <div class="guided-main">
            <ol class="guided-steps">
              <template for:each={guidedSteps} for:item="st">
                <li key={st.key} class={st.className} data-key={st.key} onclick={handleGuidedRow}>
                  <span class="guided-mark" aria-hidden="true">
                    <template lwc:if={st.done}>
                      <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                    </template>
                    <template lwc:else>{st.number}</template>
                  </span>
                  <div class="guided-body">
                    <button
                      class="guided-title"
                      type="button"
                      data-key={st.key}
                      aria-pressed={st.pressed}
                      onclick={handleGuidedSelect}
                    >
                      {st.title}
                    </button>
                    <p class="guided-text">{st.text}</p>
                    <p lwc:if={st.status} class="guided-status">{st.status}</p>
                    <template lwc:if={st.isViews}>
                      <div class="view-names">
                        <div class="view-names-head" aria-hidden="true">
                          <span>View</span>
                          <span>Sources</span>
                          <span>Active</span>
                        </div>
                        <template for:each={viewRows} for:item="v">
                          <div key={v.key} class={v.className}>
                            <span class="view-name">
                              <span class="view-name-text">{v.name}</span>
                              <code lwc:if={v.labelName} class="view-label">{v.labelName}</code>
                            </span>
                            <span class="view-used">{v.used}</span>
                            <lightning-input
                              class="view-active"
                              type="toggle"
                              label={v.name}
                              variant="label-hidden"
                              message-toggle-active=""
                              message-toggle-inactive=""
                              checked={v.active}
                              disabled={v.isAll}
                              data-key={v.key}
                              onchange={handleViewActive}
                            ></lightning-input>
                          </div>
                        </template>
                        <p class="view-names-note">
                          <span
                            >To rename a view, change its custom label: the English value, or its Spanish
                            translation.</span
                          >
                          <a href="/lightning/setup/ExternalStrings/home" target="_blank" rel="noopener"
                            >Open Custom Labels</a
                          >
                        </p>
                      </div>
                    </template>
                    <template lwc:if={st.isFit}>
                      <div class="guided-choices fit">
                        <section class={st.fit.className} aria-label={st.fit.label}>
                          <div class="fit-card-head">
                            <span class="fit-state">{st.fit.orgText}</span>
                            <span class="fit-state">{st.fit.timelineText}</span>
                          </div>
                          <p class="fit-card-advice">{st.fit.advice}</p>
                          <lightning-input
                            class="fit-use"
                            type="checkbox"
                            label={st.fit.checkLabel}
                            checked={st.fit.want}
                            disabled={st.fit.disabled}
                            data-key={st.fit.key}
                            onchange={handleFitUse}
                          ></lightning-input>
                          <ul lwc:if={st.fit.changes.length} class="fit-changes">
                            <template for:each={st.fit.changes} for:item="ch">
                              <li key={ch.key}>{ch.text}</li>
                            </template>
                          </ul>
                        </section>
                      </div>
                    </template>
                    <template lwc:if={st.showCheck}>
                      <lightning-input
                        class="guided-check"
                        type="checkbox"
                        label={st.checkLabel}
                        checked={st.done}
                        data-key={st.key}
                        onchange={handleGuidedDone}
                      ></lightning-input>
                    </template>
                  </div>
                  <div class="guided-act">
                    <template lwc:if={st.done}>
                      <span class="guided-done">
                        <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                        <span>{st.doneLabel}</span>
                      </span>
                    </template>
                    <template for:each={st.actions} for:item="a">
                      <template lwc:if={a.isLink}>
                        <a key={a.key} class="ghost guided-button" href={a.href} target="_blank" rel="noopener">
                          <lightning-icon icon-name="utility:new_window" size="xx-small"></lightning-icon>
                          <span>{a.label}</span>
                        </a>
                      </template>
                      <template lwc:else>
                        <button
                          key={a.key}
                          class={a.className}
                          type="button"
                          data-handler={a.handler}
                          data-fit={a.fit}
                          onclick={handleGuidedAction}
                        >
                          {a.label}
                        </button>
                      </template>
                    </template>
                  </div>
                </li>
              </template>
            </ol>
          </div>

          <aside class="aside-panel guided-aside" aria-live="polite" aria-labelledby="guided-about">
            <p class="guided-aside-step">{guidedAsideStep}</p>
            <h2 class="aside-title" id="guided-about">{guidedSelectedStep.title}</h2>
            <div class="guided-aside-part">
              <h3 class="guided-aside-head">{guidedAsideWhat}</h3>
              <p>{guidedSelectedStep.what}</p>
            </div>
            <div class="guided-aside-part">
              <h3 class="guided-aside-head">Why it matters</h3>
              <p>{guidedSelectedStep.why}</p>
            </div>
          </aside>
        </div>
      </template>

      <!-- The record pages to choose from -->
      <!-- Docs: the Config Guide and the FAQs -->
      <template lwc:elseif={isDiagnostics}>
        <c-time-shift-diagnostics></c-time-shift-diagnostics>
      </template>

      <template lwc:elseif={isDocsPage}>
        <header class="page-head">
          <div class="page-head-text">
            <h1 class="page-title" tabindex="-1">Docs</h1>
            <p class="page-lede">How to set up Time Trail, and answers to the common questions.</p>
          </div>
        </header>
        <ul class="docs-list">
          <template for:each={docs} for:item="d">
            <li key={d.key}>
              <button class="docs-card" type="button" data-doc={d.key} onclick={handleOpenDoc}>
                <span class="docs-card-icon" aria-hidden="true">
                  <lightning-icon icon-name={d.icon} size="small"></lightning-icon>
                </span>
                <span class="docs-card-text">
                  <span class="docs-card-title">{d.title}</span>
                  <span class="docs-card-body">{d.summary}</span>
                  <span class="docs-card-meta">{d.meta}</span>
                </span>
                <lightning-icon
                  class="docs-card-go"
                  icon-name="utility:chevronright"
                  size="x-small"
                  aria-hidden="true"
                ></lightning-icon>
              </button>
            </li>
          </template>
        </ul>
      </template>

      <!-- One doc, with the breadcrumb back to Docs -->
      <template lwc:elseif={isDocPage}>
        <header class="page-head">
          <div class="page-head-text">
            <h1 class="page-title" tabindex="-1">{doc.title}</h1>
            <p class="page-lede">{doc.summary}</p>
          </div>
        </header>
        <template lwc:if={docLoading}>
          <div class="doc-loading" role="status">
            <span class="doc-loading-line"></span>
            <span class="doc-loading-line"></span>
            <span class="doc-loading-line doc-loading-line_short"></span>
            <span class="slds-assistive-text">Loading {doc.title} from GitHub</span>
          </div>
        </template>
        <template lwc:elseif={docFailed}>
          <div class="doc-failed" role="alert">
            <lightning-icon icon-name="utility:offline" size="small" aria-hidden="true"></lightning-icon>
            <div class="doc-failed-text">
              <p class="doc-failed-title">{doc.title} didn't load from GitHub</p>
              <p class="quiet">Your network may block GitHub. You can read it on GitHub instead.</p>
              <div class="doc-failed-actions">
                <button class="ghost" type="button" onclick={handleDocRetry}>Try again</button>
                <a class="text-link" href={docWebUrl} target="_blank" rel="noopener">Open on GitHub</a>
              </div>
            </div>
          </div>
        </template>
        <template lwc:elseif={isGuideDoc}>
          <div class="doc" ondoclink={handleDocLink}>
            <article class="doc-body">
              <template for:each={docSections} for:item="s">
                <section key={s.key} class="doc-section" data-section={s.id}>
                  <h2 lwc:if={s.hasHeading} class="doc-h2">{s.heading}</h2>
                  <c-time-shift-doc-blocks blocks={s.blocks}></c-time-shift-doc-blocks>
                </section>
              </template>
            </article>
            <nav class="doc-toc" aria-label="On this page">
              <p class="doc-toc-title">On this page</p>
              <ol class="doc-toc-list">
                <template for:each={docToc} for:item="s">
                  <li key={s.key}>
                    <button class="doc-toc-link" type="button" data-section={s.id} onclick={handleDocSection}>
                      {s.title}
                    </button>
                  </li>
                </template>
              </ol>
              <a class="text-link doc-source" href={docWebUrl} target="_blank" rel="noopener">View on GitHub</a>
            </nav>
          </div>
        </template>
        <template lwc:else>
          <div class="doc" ondoclink={handleDocLink}>
            <div class="doc-faq-wrap">
              <div class="look-search faq-search">
                <lightning-icon
                  class="picker-glass"
                  icon-name="utility:search"
                  size="x-small"
                  aria-hidden="true"
                ></lightning-icon>
                <input
                  class="look-input"
                  type="search"
                  aria-label="Search the FAQs"
                  placeholder="Search the questions and answers"
                  autocomplete="off"
                  value={faqQuery}
                  oninput={handleFaqQuery}
                />
              </div>
              <p class="quiet faq-count" aria-live="polite">{faqCountText}</p>
              <template lwc:if={faqNone}>
                <div class="empty-state empty-state_filter">
                  <p class="problem-title">No questions match</p>
                  <p class="problem-cause">Try other words, or read the Config Guide.</p>
                  <button class="ghost" type="button" onclick={handleFaqClear}>Clear search</button>
                </div>
              </template>
              <div class="kh-faq-list doc-faq">
                <template for:each={docQuestions} for:item="q">
                  <details key={q.key} class="kh-faq-item doc-anchor" data-section={q.id} open={q.open}>
                    <summary class="kh-faq-question">
                      <span>{q.title}</span>
                      <lightning-icon
                        class="kh-faq-chevron"
                        icon-name="utility:chevrondown"
                        size="x-small"
                        aria-hidden="true"
                      ></lightning-icon>
                    </summary>
                    <c-time-shift-doc-blocks class="kh-faq-answer" blocks={q.blocks}></c-time-shift-doc-blocks>
                  </details>
                </template>
              </div>
            </div>
            <nav class="doc-toc" aria-label="On this page">
              <p class="doc-toc-title">On this page</p>
              <ol class="doc-toc-list">
                <template for:each={docQuestions} for:item="s">
                  <li key={s.key}>
                    <button class="doc-toc-link" type="button" data-section={s.id} onclick={handleDocSection}>
                      {s.title}
                    </button>
                  </li>
                </template>
              </ol>
              <a class="text-link doc-source" href={docWebUrl} target="_blank" rel="noopener">View on GitHub</a>
            </nav>
          </div>
        </template>
      </template>

      <template lwc:elseif={isPagesPage}>
        <header class="page-head">
          <h1 class="page-title" tabindex="-1">Customize: which record page?</h1>
          <p class="page-lede">
            Choose the record page whose timeline you want to change. Then add sources, make them active or inactive,
            and edit them.
          </p>
        </header>

        <template lwc:if={loadError}>
          <div class="problem-state" role="alert">
            <img class="problem-art" src={errorImage} alt="" />
            <p class="problem-title">{loadError.message}</p>
            <p class="problem-cause" lwc:if={loadError.cause}>{loadError.cause}</p>
            <button class="ghost" type="button" onclick={handleRetryLoad}>Try again</button>
          </div>
        </template>
        <template lwc:else>
          <section class="group" aria-label="Record pages">
            <ul class="list">
              <template for:each={parentCards} for:item="p">
                <li key={p.value} class="row row_page">
                  <button
                    class="row-main pcard"
                    type="button"
                    data-value={p.value}
                    aria-label={p.openLabel}
                    onclick={handleParentCard}
                  >
                    <span class="tile"><lightning-icon icon-name={p.icon} size="small"></lightning-icon></span>
                    <span class="row-text">
                      <span class="row-name pcard-name">{p.label}</span>
                      <span class="row-summary pcard-count">{p.countText}</span>
                    </span>
                    <span class="pcard-rail" aria-hidden="true">
                      <template for:each={p.dots} for:item="d">
                        <span key={d.key} class="pcard-dot" style={d.style}></span>
                      </template>
                    </span>
                    <lightning-icon
                      class="row-chevron"
                      icon-name="utility:chevronright"
                      size="x-small"
                      aria-hidden="true"
                    ></lightning-icon>
                  </button>
                </li>
              </template>
              <li class="row row_soon">
                <span class="tile tile_soon"
                  ><lightning-icon icon-name="utility:add" size="small"></lightning-icon
                ></span>
                <span class="row-text">
                  <span class="row-name">More record pages</span>
                  <span class="row-summary">Other record pages are planned.</span>
                </span>
              </li>
            </ul>
          </section>
        </template>
      </template>

      <!-- A record page: its sources, by type -->
      <template lwc:elseif={isParentPage}>
        <header class="page-head page-head_split page-head_tight">
          <div class="page-head-text">
            <h1 class="page-title" tabindex="-1">{selectedLabel} timeline</h1>
          </div>
          <button class="primary" type="button" onclick={handleAdd}>
            <lightning-icon icon-name="utility:add" size="x-small" variant="inverse"></lightning-icon>
            <span>Add a source</span>
          </button>
        </header>

        <template lwc:if={loadError}>
          <div class="problem-state" role="alert">
            <img class="problem-art" src={errorImage} alt="" />
            <p class="problem-title">{loadError.message}</p>
            <p class="problem-cause" lwc:if={loadError.cause}>{loadError.cause}</p>
            <button class="ghost" type="button" onclick={handleRetryLoad}>Try again</button>
          </div>
        </template>
        <template lwc:elseif={hasSelectedSources}>
          <div class="source-filter">
            <div class="look-search source-search">
              <lightning-icon
                class="picker-glass"
                icon-name="utility:search"
                size="x-small"
                aria-hidden="true"
              ></lightning-icon>
              <input
                class="look-input"
                type="search"
                aria-label="Search sources"
                placeholder="Search sources: name, object, category…"
                autocomplete="off"
                spellcheck="false"
                value={sourceQuery}
                oninput={handleSourceQuery}
              />
            </div>
            <div class="look-sets" role="group" aria-label="Source type">
              <template for:each={sourceTypes} for:item="t">
                <button
                  key={t.key}
                  class={t.className}
                  type="button"
                  aria-pressed={t.pressed}
                  data-value={t.key}
                  onclick={handleSourceType}
                >
                  {t.text}
                </button>
              </template>
            </div>
            <span class="source-filter-rule" aria-hidden="true"></span>
            <div class="look-sets" role="group" aria-label="Status">
              <template for:each={sourceStatuses} for:item="t">
                <button
                  key={t.key}
                  class={t.className}
                  type="button"
                  aria-pressed={t.pressed}
                  data-value={t.key}
                  onclick={handleSourceStatus}
                >
                  {t.text}
                </button>
              </template>
            </div>
          </div>
          <p class="quiet source-count" aria-live="polite">{sourceCountText}</p>
          <template lwc:if={hasFilteredSources}>
            <ul class="list">
              <template for:each={sourceRows} for:item="src">
                <li key={src.developerName} class={src.className} style={src.style}>
                  <button
                    class="row-main"
                    type="button"
                    data-name={src.developerName}
                    aria-label={src.viewLabel}
                    onclick={handleViewSource}
                  >
                    <span class="chip" style={src.chipStyle}>
                      <lightning-icon icon-name={src.iconName} size="x-small" variant="inverse"></lightning-icon>
                    </span>
                    <span class="row-text">
                      <span class="row-line">
                        <span class="row-name">{src.label}</span>
                        <span lwc:if={src.category} class="badge">{src.categoryLabel}</span>
                        <span lwc:if={src.offText} class="badge badge_off">{src.offText}</span>
                      </span>
                      <span class="row-summary">{src.summary}</span>
                    </span>
                  </button>
                  <div class="row-end">
                    <template lwc:if={src.pending}>
                      <span class="pending" role="status">
                        <span class="pending-dot" aria-hidden="true"></span>{src.pendingText}
                      </span>
                    </template>
                    <template lwc:else>
                      <lightning-input
                        class="row-toggle"
                        type="toggle"
                        label={src.toggleLabel}
                        variant="label-hidden"
                        message-toggle-active=""
                        message-toggle-inactive=""
                        checked={src.active}
                        data-name={src.developerName}
                        onchange={handleToggle}
                      ></lightning-input>
                    </template>
                  </div>
                </li>
              </template>
            </ul>
          </template>
          <template lwc:else>
            <div class="empty-state empty-state_filter">
              <p class="problem-title">No sources match</p>
              <p class="problem-cause">Try another word, or other filters.</p>
              <button class="ghost" type="button" onclick={handleClearSourceFilter}>Clear filters</button>
            </div>
          </template>
        </template>
        <template lwc:else>
          <div class="empty-state">
            <p class="problem-title">Nothing on the {selectedLabel} timeline yet</p>
            <p class="problem-cause">Add a source to put records on it.</p>
            <button class="primary" type="button" onclick={handleAdd}>Add a source</button>
          </div>
        </template>
      </template>

      <!-- One source: how it is set up -->
      <template lwc:elseif={isSourcePage}>
        <header class="page-head page-head_split">
          <div class="source-head">
            <span class="chip chip_large" style={viewing.chipStyle}>
              <lightning-icon icon-name={viewing.iconName} size="small" variant="inverse"></lightning-icon>
            </span>
            <div class="page-head-text">
              <h1 class="page-title" tabindex="-1">{viewing.label}</h1>
              <p class="page-lede">{viewing.summary}</p>
            </div>
          </div>
          <div class="head-actions">
            <template lwc:if={viewingRow}>
              <template lwc:if={viewingRow.pending}>
                <span class="pending" role="status">
                  <span class="pending-dot" aria-hidden="true"></span>{viewingRow.pendingText}
                </span>
              </template>
              <template lwc:else>
                <lightning-input
                  class="head-toggle"
                  type="toggle"
                  label="Active"
                  message-toggle-active=""
                  message-toggle-inactive=""
                  checked={viewingRow.active}
                  data-name={viewing.developerName}
                  onchange={handleToggle}
                ></lightning-input>
              </template>
            </template>
            <div class="head-buttons">
              <button class="ghost ghost_danger" type="button" data-name={viewing.developerName} onclick={handleRemove}>
                <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                <span>Remove</span>
              </button>
              <button class="primary" type="button" data-name={viewing.developerName} onclick={handleEdit}>
                <lightning-icon icon-name="utility:edit" size="x-small" variant="inverse"></lightning-icon>
                <span>Edit</span>
              </button>
            </div>
          </div>
        </header>

        <div class="source-body">
          <section class="setup-panel" aria-labelledby="facts-title">
            <h2 class="section-title" id="facts-title">How it's set up</h2>
            <dl class="facts">
              <template for:each={viewFacts} for:item="f">
                <div key={f.key} class="fact">
                  <dt>{f.label}</dt>
                  <dd>{f.value}</dd>
                </div>
              </template>
              <div class="fact fact_preview">
                <dt>Interactions</dt>
                <dd>
                  <p class="fact-preview-note">
                    <span class="mock-badge">Sample values</span>
                    <span>{previewSourceNote}</span>
                  </p>
                  <div class="mock-item mock-item_open">
                    <div class="mock-row">
                      <span class="mock-chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
                      </span>
                      <span class="node" style={nodeStyle}>
                        <lightning-icon icon-name={iconName} size="xx-small" variant="inverse"></lightning-icon>
                      </span>
                      <span class="mock-main">
                        <span class="mock-title mock-title_link">{previewTitle}</span>
                        <span lwc:if={previewSubtitle} class="mock-sub">{previewSubtitle}</span>
                      </span>
                      <span class="mock-time">{previewTime}</span>
                    </div>
                    <div class="mock-detail">
                      <template lwc:if={previewLoading}>
                        <span class="mock-line"></span>
                        <span class="mock-line mock-line_short"></span>
                      </template>
                      <template lwc:elseif={previewEmpty}>
                        <p class="mock-empty">{previewEmptyText}</p>
                      </template>
                      <template lwc:else>
                        <dl class="mock-facts">
                          <template for:each={previewFacts} for:item="f">
                            <div key={f.key} class="mock-fact">
                              <dt>{f.label}</dt>
                              <dd>{f.value}</dd>
                            </div>
                          </template>
                        </dl>
                      </template>
                    </div>
                  </div>
                  <template lwc:if={isSalesforce}>
                    <div class="mock-arrow" aria-hidden="true">
                      <lightning-icon icon-name="utility:arrowdown" size="x-small"></lightning-icon>
                    </div>
                    <div class="mock-page">
                      <div class={clickPageHeadClass}>
                        <span class="mock-page-icon"
                          ><lightning-icon icon-name="utility:record" size="x-small" variant="inverse"></lightning-icon
                        ></span>
                        <span class="mock-page-text">
                          <span class="mock-page-object">{clickPageLabel}</span>
                          <span class="mock-page-name">{clickPageName}</span>
                        </span>
                      </div>
                      <dl class="mock-page-facts">
                        <template for:each={clickPageFacts} for:item="f">
                          <div key={f.key} class="mock-fact">
                            <dt>{f.label}</dt>
                            <dd>{f.value}</dd>
                          </div>
                        </template>
                      </dl>
                    </div>
                  </template>
                </dd>
              </div>
            </dl>
          </section>
          <aside class="aside-panel source-looks" aria-labelledby="looks-title">
            <h2 class="aside-title" id="looks-title">How it looks</h2>
            <figure class="mock mock_static">
              <figcaption class="mock-caption">
                <span class="mock-badge">Sample values</span>
                <span>In the timeline's legend and filters, in order</span>
              </figcaption>
              <div class="mock-filter">
                <p class="mock-filter-head">{sourceFilterHead}</p>
                <ol class="mock-filter-list">
                  <template for:each={sourceFilterRows} for:item="r">
                    <li key={r.key} class={r.className}>
                      <span class="mock-place">{r.place}</span>
                      <span class="chip chip_small" style={r.chipStyle}>
                        <lightning-icon icon-name={r.icon} size="xx-small" variant="inverse"></lightning-icon>
                      </span>
                      <span class="mock-filter-text">
                        <span class="mock-filter-name">{r.name}</span>
                        <span lwc:if={r.view} class="mock-filter-view">{r.view}</span>
                      </span>
                      <span lwc:if={r.mine} class="badge badge_this">This source</span>
                      <span lwc:else class="mock-count">{r.count}</span>
                    </li>
                  </template>
                </ol>
              </div>
            </figure>
          </aside>
        </div>
      </template>

      <!-- Adding or editing a source: one question at a time -->
      <template lwc:elseif={isWizard}>
        <section class="wizard" aria-labelledby="wizard-title" onkeydown={handleKeydown}>
          <header class="wz-head">
            <h1 class="slds-assistive-text" id="wizard-title">{wizardTitle}</h1>
            <ol class="thread" aria-label="Steps">
              <template for:each={thread} for:item="k">
                <li key={k.key} class={k.className}>
                  <button
                    class="knot-button"
                    type="button"
                    data-step={k.step}
                    disabled={k.disabled}
                    aria-current={k.ariaCurrent}
                    aria-label={k.ariaLabel}
                    onclick={handleKnot}
                  >
                    <span class="knot-step">{k.number}</span>
                    <span class="knot-name">{k.name}</span>
                  </button>
                </li>
              </template>
            </ol>
          </header>

          <div class="wz-body">
            <div class="wz-main">
              <template for:each={scenes} for:item="scene">
                <div key={scene.key} class={scene.className}>
                  <h2 class="question" tabindex="-1">{question}</h2>
                  <p class="hint" lwc:if={hint}>{hint}</p>

                  <template lwc:if={stepError}>
                    <div class="notice notice_error" role="alert">
                      <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                      <div>
                        <p class="notice-title">{stepError.message}</p>
                        <p lwc:if={stepError.cause}>{stepError.cause}</p>
                      </div>
                    </div>
                  </template>

                  <!-- Parent: the record pages the timeline sits on -->
                  <template lwc:if={isParentStep}>
                    <div class="options" role="radiogroup" aria-label="The records the timeline sits on">
                      <template for:each={parentTiles} for:item="p">
                        <button
                          key={p.value}
                          class={p.className}
                          type="button"
                          role="radio"
                          aria-checked={p.checked}
                          data-value={p.value}
                          onclick={handleParent}
                        >
                          <span class="option-icon"
                            ><lightning-icon icon-name={p.icon} size="small"></lightning-icon
                          ></span>
                          <span class="option-text">
                            <span class="option-label">{p.label}</span>
                            <span class="option-detail">{p.detail}</span>
                          </span>
                        </button>
                      </template>
                    </div>
                    <p class="quiet">More record pages are coming.</p>
                  </template>

                  <!-- Kind: four answers, 1 to 4 on the keyboard -->
                  <template lwc:if={isKindStep}>
                    <div class="options" role="radiogroup" aria-label="Where the records come from">
                      <template for:each={kindTiles} for:item="k">
                        <button
                          key={k.value}
                          class={k.className}
                          type="button"
                          role="radio"
                          aria-checked={k.checked}
                          data-value={k.value}
                          disabled={k.disabled}
                          onclick={handleKind}
                        >
                          <span class="option-icon"
                            ><lightning-icon icon-name={k.icon} size="small"></lightning-icon
                          ></span>
                          <span class="option-text">
                            <span class="option-label">{k.label}</span>
                            <span class="option-detail">{k.detail}</span>
                          </span>
                          <kbd class="key" aria-hidden="true">{k.shortcut}</kbd>
                        </button>
                      </template>
                    </div>
                  </template>

                  <!-- A search list: objects, classes, dates, individual fields -->
                  <!-- Data 360, more than one data space: which holds the engagement -->
                  <template lwc:if={showSpaceChooser}>
                    <h3 class="second-question space-question">Which data space holds this engagement?</h3>
                    <lightning-combobox
                      class="space-field"
                      label="Data space"
                      variant="label-hidden"
                      placeholder="Choose a data space"
                      options={spaceOptions}
                      value={draft.dataSpace}
                      onchange={handleDataSpace}
                    ></lightning-combobox>
                  </template>

                  <template lwc:if={showPicker}>
                    <div class="picker" onfocusout={handlePickerFocusout}>
                      <div class="picker-field">
                        <lightning-icon class="picker-glass" icon-name="utility:search" size="x-small"></lightning-icon>
                        <input
                          class="picker-input"
                          type="text"
                          role="combobox"
                          aria-label={pickerLabel}
                          aria-expanded={pickerExpanded}
                          aria-controls="picker-list"
                          aria-autocomplete="list"
                          aria-activedescendant={activeDescendant}
                          autocomplete="off"
                          spellcheck="false"
                          placeholder={pickerPlaceholder}
                          value={pickerInputValue}
                          oninput={handleQuery}
                          onclick={handlePickerClick}
                          onkeydown={handlePickerKeydown}
                        />
                        <span lwc:if={pickerBusy} class="picker-spinner" role="status">
                          <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>
                        </span>
                      </div>
                      <ul
                        lwc:if={showPickerResults}
                        class="results"
                        id="picker-list"
                        role="listbox"
                        aria-label={pickerLabel}
                        onmousedown={handleResultsMousedown}
                      >
                        <template for:each={pickerResults} for:item="r">
                          <li
                            key={r.value}
                            id={r.id}
                            class={r.className}
                            role="option"
                            aria-selected={r.ariaSelected}
                            data-value={r.value}
                            data-index={r.index}
                            onclick={handleResultClick}
                            onmouseenter={handleResultHover}
                          >
                            <span class="result-label">{r.before}<mark lwc:if={r.match}>{r.match}</mark>{r.after}</span>
                            <span lwc:if={r.tag} class="result-tag">{r.tag}</span>
                            <span class="result-detail">{r.detail}</span>
                          </li>
                        </template>
                      </ul>
                      <template lwc:if={showPickerResults}>
                        <p class="quiet" lwc:if={pickerEmpty}>{pickerEmpty}</p>
                        <p class="quiet" lwc:if={pickerMore}>{pickerMore}</p>
                      </template>
                    </div>
                  </template>

                  <template lwc:if={showRelatedDate}>
                    <div class="related-date">
                      <lightning-button
                        variant="base"
                        icon-name="utility:link"
                        label="A date on a related record"
                        aria-expanded={relatedDateOpen}
                        onclick={handleRelatedDateToggle}
                      ></lightning-button>
                      <template lwc:if={relatedDateOpen}>
                        <c-time-shift-field-picker
                          fields={fields}
                          label="Search related records"
                          root-lookups-only="true"
                          types={dateTypes}
                          onpick={handleRelatedDatePick}
                          onclose={handleRelatedDateClose}
                        ></c-time-shift-field-picker>
                      </template>
                    </div>
                  </template>

                  <!-- Data 360: the field that holds the individual, under the object -->
                  <template lwc:if={isIndividualStep}>
                    <h3 class="second-question link-question">{individualQuestion}</h3>
                    <p class="quiet">{individualHint}</p>
                    <lightning-combobox
                      class="individual-field"
                      label={individualQuestion}
                      variant="label-hidden"
                      placeholder="Choose a field"
                      options={individualCombo}
                      value={draft.individualField}
                      onchange={handleIndividualField}
                    ></lightning-combobox>
                  </template>

                  <!-- Link: the ways these records belong to a Contact -->
                  <template lwc:if={isLinkStep}>
                    <h3 class="second-question link-question">{linkQuestion}</h3>
                    <template lwc:if={loadingSchema}>
                      <div class="wait" role="status">
                        <lightning-spinner alternative-text="Reading the object" size="small"></lightning-spinner>
                      </div>
                    </template>
                    <template lwc:elseif={noLinks}>
                      <div class="notice">
                        <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                        <div>
                          <p class="notice-title">{noLinksTitle}</p>
                          <p>{noLinksText}</p>
                        </div>
                      </div>
                    </template>
                    <template lwc:else>
                      <template lwc:if={linkFocused}>
                        <div class="link-focus">
                          <div class="link-chosen">
                            <div class="option option_on option_chosen">
                              <span class="option-icon"
                                ><lightning-icon icon-name={chosenLink.icon} size="small"></lightning-icon
                              ></span>
                              <span class="option-text">
                                <span class="option-label">{chosenLink.label}</span>
                                <span class="option-detail">{linkKindText}</span>
                              </span>
                              <lightning-button-icon
                                class="link-close"
                                icon-name="utility:close"
                                variant="bare"
                                alternative-text="Show every way they link"
                                title="Show every way they link"
                                onclick={handleLinkChange}
                              ></lightning-button-icon>
                            </div>
                          </div>
                          <div class="link-model link-story">
                            <p>{linkStory}</p>
                            <p lwc:if={linkKindNote} class="link-note">{linkKindNote}</p>
                          </div>
                        </div>
                      </template>
                      <template lwc:if={showLinkSearch}>
                        <div class="link-search">
                          <lightning-input
                            type="search"
                            label="Search the ways they link"
                            variant="label-hidden"
                            placeholder="Search the ways they link"
                            value={linkQuery}
                            onchange={handleLinkQuery}
                          ></lightning-input>
                          <p class="quiet" aria-live="polite">{linkCountText}</p>
                        </div>
                      </template>
                      <p lwc:if={noLinkMatches} class="quiet">Nothing matches. Try another word.</p>
                      <div class={linkOptionsClass} role="radiogroup" aria-label="How they link">
                        <template for:each={linkChoices} for:item="l">
                          <p key={l.groupKey} lwc:if={l.groupHeading} class="link-group">{l.groupHeading}</p>
                          <button
                            key={l.key}
                            class={l.className}
                            type="button"
                            role="radio"
                            aria-checked={l.checked}
                            data-key={l.key}
                            disabled={l.disabled}
                            onclick={handleLink}
                          >
                            <span class="option-icon"
                              ><lightning-icon icon-name={l.icon} size="small"></lightning-icon
                            ></span>
                            <span class="option-text">
                              <span class="option-label">{l.label}</span>
                              <span class="option-detail">{l.kindText}</span>
                            </span>
                          </button>
                        </template>
                      </div>
                    </template>
                  </template>

                  <!-- Filter: every record, or conditions -->
                  <template lwc:if={isFilterStep}>
                    <h3 class="second-question link-question">All of them, or only some?</h3>
                    <div class="options options_pair" role="radiogroup" aria-label="Which records">
                      <template for:each={filterChoices} for:item="c">
                        <button
                          key={c.value}
                          class={c.className}
                          type="button"
                          role="radio"
                          aria-checked={c.checked}
                          data-value={c.value}
                          onclick={handleFilterMode}
                        >
                          <span class="option-icon"
                            ><lightning-icon icon-name={c.icon} size="small"></lightning-icon
                          ></span>
                          <span class="option-text">
                            <span class="option-label">{c.label}</span>
                            <span class="option-detail">{c.detail}</span>
                          </span>
                        </button>
                      </template>
                    </div>
                    <template lwc:if={showConditions}>
                      <div class="conditions-box">
                        <ul class="conditions">
                          <template for:each={conditionRows} for:item="c">
                            <li key={c.key} class="condition">
                              <span class="condition-join">{c.joinText}</span>
                              <lightning-combobox
                                class="condition-field"
                                label="Field"
                                variant="label-hidden"
                                placeholder="Field"
                                options={conditionFieldOptions}
                                value={c.field}
                                data-index={c.index}
                                data-part="field"
                                onchange={handleConditionChange}
                              ></lightning-combobox>
                              <lightning-combobox
                                class="condition-op"
                                label="Operator"
                                variant="label-hidden"
                                options={c.operators}
                                value={c.operator}
                                disabled={c.noField}
                                data-index={c.index}
                                data-part="operator"
                                onchange={handleConditionChange}
                              ></lightning-combobox>
                              <span class="condition-value">
                                <template lwc:if={c.isPicklist}>
                                  <lightning-combobox
                                    label="Value"
                                    variant="label-hidden"
                                    placeholder="Value"
                                    options={c.picklistValues}
                                    value={c.value}
                                    data-index={c.index}
                                    data-part="value"
                                    onchange={handleConditionChange}
                                  ></lightning-combobox>
                                </template>
                                <template lwc:elseif={c.isBoolean}>
                                  <lightning-combobox
                                    label="Value"
                                    variant="label-hidden"
                                    options={booleanOptions}
                                    value={c.value}
                                    data-index={c.index}
                                    data-part="value"
                                    onchange={handleConditionChange}
                                  ></lightning-combobox>
                                </template>
                                <template lwc:elseif={c.isDate}>
                                  <lightning-input
                                    type="date"
                                    label="Value"
                                    variant="label-hidden"
                                    value={c.value}
                                    data-index={c.index}
                                    data-part="value"
                                    onchange={handleConditionChange}
                                  ></lightning-input>
                                </template>
                                <template lwc:elseif={c.isNumber}>
                                  <lightning-input
                                    type="number"
                                    step="any"
                                    label="Value"
                                    variant="label-hidden"
                                    value={c.value}
                                    data-index={c.index}
                                    data-part="value"
                                    onchange={handleConditionChange}
                                  ></lightning-input>
                                </template>
                                <template lwc:elseif={c.isText}>
                                  <lightning-input
                                    label="Value"
                                    variant="label-hidden"
                                    placeholder="Value"
                                    value={c.value}
                                    disabled={c.noField}
                                    data-index={c.index}
                                    data-part="value"
                                    onchange={handleConditionChange}
                                  ></lightning-input>
                                </template>
                              </span>
                              <lightning-button-icon
                                icon-name="utility:close"
                                variant="bare"
                                alternative-text={c.removeLabel}
                                title={c.removeLabel}
                                data-index={c.index}
                                onclick={handleRemoveCondition}
                              ></lightning-button-icon>
                            </li>
                          </template>
                        </ul>
                        <template lwc:if={relatedFilterOpen}>
                          <c-time-shift-field-picker
                            fields={fields}
                            label="Search related records"
                            root-lookups-only="true"
                            onpick={handleRelatedFilterPick}
                            onclose={handleRelatedFilterClose}
                          ></c-time-shift-field-picker>
                        </template>
                        <div class="box-actions">
                          <lightning-button
                            variant="base"
                            icon-name="utility:add"
                            label="Add another condition"
                            onclick={handleAddCondition}
                          ></lightning-button>
                        </div>
                      </div>
                    </template>
                    <template lwc:if={filterFixed}>
                      <div class="conditions-box">
                        <p class="tune-help">
                          This source ships with a filter the condition builder can't show. It stays as it is until you
                          replace it.
                        </p>
                        <p><code class="code">{draft.filter}</code></p>
                        <button class="link-button" type="button" onclick={handleReplaceFilter}>
                          Replace it with conditions
                        </button>
                      </div>
                    </template>
                  </template>

                  <!-- Lens: which lens the source belongs to, under the date -->
                  <template lwc:if={isLensStep}>
                    <h3 class="second-question link-question" id="lens-heading">Which lens?</h3>
                    <div class="tune-view">
                      <div class="second second_tight">
                        <p class="tune-help">Pick the timeline lens it belongs to.</p>
                        <div class="chips" role="group" aria-labelledby="lens-heading">
                          <template for:each={viewChoices} for:item="v">
                            <button
                              key={v.label}
                              class={v.className}
                              type="button"
                              aria-pressed={v.pressed}
                              data-value={v.value}
                              onclick={handleView}
                            >
                              {v.label}
                            </button>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>

                  <!-- Range: how far back, with what each would read -->
                  <template lwc:if={isRangeStep}>
                    <p class="volume" lwc:if={hasVolumes}>
                      <lightning-icon icon-name="utility:database" size="x-small"></lightning-icon>
                      <span>{volumeHeadline}</span>
                    </p>
                    <p class="quiet" lwc:if={volumeUnavailable}>Record counts aren't available for this object.</p>
                    <div class="options options_ranges" role="radiogroup" aria-label="How far back">
                      <template for:each={rangeChoices} for:item="r">
                        <button
                          key={r.key}
                          class={r.className}
                          type="button"
                          role="radio"
                          aria-checked={r.checked}
                          data-value={r.value}
                          onclick={handleRange}
                        >
                          <span class="option-text">
                            <span class="option-label">{r.label}</span>
                            <span class="option-detail" lwc:if={r.detail}>{r.detail}</span>
                          </span>
                          <span lwc:if={r.tag} class={r.tagClass}>{r.tag}</span>
                        </button>
                      </template>
                    </div>
                  </template>

                  <!-- Name: what it's called, and its view -->
                  <template lwc:if={isNameStep}>
                    <div class="tune">
                      <section class="tune-item" aria-labelledby="tune-legend">
                        <h3 class="tune-label" id="tune-legend">Name</h3>
                        <p class="tune-help">What the legend and filters call these items.</p>
                        <template lwc:if={legendFocused}>
                          <div class="link-chosen">
                            <div class="option option_on option_chosen">
                              <span class="option-icon"
                                ><lightning-icon icon-name={chosenLegend.icon} size="x-small"></lightning-icon
                              ></span>
                              <span class="option-text">
                                <span class="option-label">{chosenLegend.title}</span>
                                <span class="option-detail">{chosenLegend.text}</span>
                              </span>
                              <lightning-button-icon
                                class="link-close"
                                icon-name="utility:close"
                                variant="bare"
                                alternative-text="Show every way to name it"
                                title="Show every way to name it"
                                onclick={handleLegendChange}
                              ></lightning-button-icon>
                            </div>
                          </div>
                        </template>
                        <div class={legendOptionsClass} role="radiogroup" aria-labelledby="tune-legend">
                          <template for:each={legendModes} for:item="m">
                            <button
                              key={m.value}
                              class={m.className}
                              type="button"
                              role="radio"
                              aria-checked={m.checked}
                              data-value={m.value}
                              onclick={handleLegendMode}
                            >
                              <span class="option-icon"

                                        size="xx-small"
                                      ></lightning-icon></template></span></template
                              ></span>
                              <span lwc:if={previewSubtitle} class="mock-sub">{previewSubtitle}</span>
                            </span>
                            <span class="mock-time">{previewTime}</span>
                          </div>
                          <div class="mock-detail">
                            <template lwc:if={previewLoading}>
                              <span class="mock-line"></span>
                              <span class="mock-line"></span>
                              <span class="mock-line mock-line_short"></span>
                            </template>
                            <template lwc:elseif={previewEmpty}>
                              <p class="mock-empty">{previewEmptyText}</p>
                            </template>
                            <template lwc:else>
                              <dl class="mock-facts">
                                <template for:each={previewFacts} for:item="f">
                                  <div key={f.key} class="mock-fact">
                                    <dt>{f.label}</dt>
                                    <dd>{f.value}</dd>
                                  </div>
                                </template>
                              </dl>
                            </template>
                          </div>
                        </div>
                        <template lwc:if={isSalesforce}>
                          <div class="mock-arrow" aria-hidden="true">
                            <lightning-icon icon-name="utility:arrowdown" size="x-small"></lightning-icon>
                          </div>
                          <div class="mock-page">
                            <div class={clickPageHeadClass}>
                              <span class="mock-page-icon"
                                ><lightning-icon
                                  icon-name="utility:record"
                                  size="x-small"
                                  variant="inverse"
                                ></lightning-icon
                              ></span>
                              <span class="mock-page-text">
                                <span class="mock-page-object">{clickPageLabel}</span>
                                <span class="mock-page-name">{clickPageName}</span>
                              </span>
                            </div>
                            <dl class="mock-page-facts">
                              <template for:each={clickPageFacts} for:item="f">
                                <div key={f.key} class="mock-fact">
                                  <dt>{f.label}</dt>
                                  <dd>{f.value}</dd>
                                </div>
                              </template>
                            </dl>
                          </div>
                        </template>
                      </figure>
                    </div>
                  </template>

                  <!-- The last question also holds Active and Save's messages -->
                  <template lwc:if={isLastStep}>
                    <lightning-input
                      class="switch-on"
                      type="toggle"
                      label="Active when saved"
                      message-toggle-active=""
                      message-toggle-inactive=""
                      checked={draft.active}
                      disabled={saving}
                      onchange={handleActive}
                    ></lightning-input>

                    <p class="quiet" lwc:if={missingAnswers}>{missingAnswers}</p>
                    <template lwc:if={saveError}>
                      <div class="notice notice_error" role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                        <div>
                          <p class="notice-title">{saveError.message}</p>
                          <p lwc:if={saveError.cause}>{saveError.cause}</p>
                        </div>
                      </div>
                    </template>
                  </template>
                </div>
              </template>
            </div>
            <aside class="wz-aside" aria-labelledby="sofar-title">
              <div class="aside-panel">
                <h2 class="aside-title" id="sofar-title">So far</h2>
                <template lwc:if={hasSoFar}>
                  <dl class="sofar">
                    <template for:each={soFar} for:item="a">
                      <div key={a.key} class="sofar-row">
                        <dt>{a.name}</dt>
                        <dd>
                          <button class="sofar-answer" type="button" data-step={a.step} onclick={handleKnot}>
                            {a.answer}
                          </button>
                        </dd>
                      </div>
                    </template>
                  </dl>
                </template>
                <template lwc:else>
                  <p class="quiet">Your answers collect here as you go. Any of them is a click away.</p>
                </template>
              </div>
            </aside>
          </div>

          <footer class="wz-foot">
            <button class="ghost" type="button" onclick={handleBack} disabled={backDisabled}>
              <lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon>
              <span>Back</span>
            </button>
            <span class="foot-hint">
              <span class="foot-step">{stepCountText}</span>
              <span lwc:if={blockedReason}>{blockedReason}</span>
            </span>
            <template lwc:if={isLastStep}>
              <button class={saveClass} type="button" disabled={saveDisabled} onclick={handleSave}>
                <span class="save-icon"
                  ><lightning-icon icon-name={saveIcon} size="x-small" variant="inverse"></lightning-icon
                ></span>
                <span>{saveLabel}</span>
              </button>
            </template>
            <template lwc:else>
              <button class="primary" type="button" disabled={continueDisabled} onclick={handleContinue}>
                <span>Next</span>
                <lightning-icon icon-name="utility:chevronright" size="x-small" variant="inverse"></lightning-icon>
              </button>
            </template>
          </footer>
        </section>
      </template>
    </div>
  </div>
</template>
