<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<title>Time Drive: Interact</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4FAF7"/><stop offset="1" stop-color="#DDEFE8"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#7FC2AC" stop-opacity="0.35"/><stop offset="1" stop-color="#7FC2AC" stop-opacity="0"/></radialGradient><clipPath id="canvas"><rect width="1500" height="1000"/></clipPath></defs>
<g clip-path="url(#canvas)">
