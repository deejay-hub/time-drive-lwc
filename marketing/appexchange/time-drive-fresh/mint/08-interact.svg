<text x="460.0" y="619.4" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0B4D43">An item, expanded</text>
<text x="460.0" y="650.9" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#0B4D43">Its details, with the item menu open</text>
<text x="460.0" y="682.4" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0B4D43" fill-opacity="0.8">772 x 552 px (capture at 2x)</text>
</g>
<rect x="690" y="412" width="260" height="520" rx="84" fill="#0B4D43" fill-opacity="0.028"/>
<rect x="702" y="424" width="236" height="496" rx="72" fill="#0B4D43" fill-opacity="0.044"/>
<rect x="712" y="434" width="216" height="476" rx="62" fill="#0B4D43" fill-opacity="0.064"/>
