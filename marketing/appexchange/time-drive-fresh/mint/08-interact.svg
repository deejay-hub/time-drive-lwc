<text x="820.0" y="669.6" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0B4D43">Menu</text>
<text x="820.0" y="711.6" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0B4D43" fill-opacity="0.8">176 x 436 px (capture at 2x)</text>
</g>
<rect x="776.0" y="444" width="88" height="22" rx="11" fill="#FFFFFF"/>
<text id="headline" x="1000" y="250" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" text-anchor="start" fill="#0B2B26">Open, edit,</text>
<text x="1000" y="336" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" text-anchor="start" fill="#0B2B26">act.</text>
