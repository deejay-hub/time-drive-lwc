<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<title>Time Drive: Setup</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4FAF7"/><stop offset="1" stop-color="#DDEFE8"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#7FC2AC" stop-opacity="0.35"/><stop offset="1" stop-color="#7FC2AC" stop-opacity="0"/></radialGradient><clipPath id="canvas"><rect width="1500" height="1000"/></clipPath></defs>
<g clip-path="url(#canvas)">
<rect id="background" width="1500" height="1000" fill="url(#bg)"/>
<circle id="glow" cx="1170.0" cy="300.0" r="620.0" fill="url(#glow)"/>
<circle cx="104" cy="140" r="6" fill="#0F6B58"/>
<text id="kicker" x="122" y="147" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start" letter-spacing="3" fill="#0F6B58">SET UP IN MINUTES</text>
<text id="headline" x="96" y="250" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" text-anchor="start" fill="#0B2B26">Guided setup.</text>
<text x="96" y="336" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" text-anchor="start" fill="#0B2B26">No code.</text>
<text id="subtext" x="96" y="440" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#44564F">Choose an object, how it links,</text>
<text x="96" y="482" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#44564F">a date and a look, with a live</text>
<text x="96" y="524" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#44564F">preview of each item as you go.</text>
