<rect x="45" y="27" width="26" height="5" rx="2.5" fill="#2A1A12"/><rect x="45" y="47" width="20" height="5" rx="2.5" fill="#2A1A12"/>
<rect x="45" y="67" width="23" height="5" rx="2.5" fill="#2A1A12" fill-opacity="0.35"/></g>
<text x="150" y="972" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start" fill="#0B4D43">Time Drive</text>
<text x="1404" y="972" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#0B4D43" fill-opacity="0.8">5 / 10</text>
</g>
