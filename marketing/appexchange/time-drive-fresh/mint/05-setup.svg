<text x="116" y="670" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0B4D43">2</text>
<text x="148" y="671" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#0B2B26">Records</text>
<circle cx="116" cy="720" r="16" fill="#0F6B58" fill-opacity="0.55" stroke="#0F6B58"/>
<text x="116" y="726" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0B4D43">3</text>
<text x="148" y="727" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#0B2B26">Date</text>
<circle cx="116" cy="776" r="16" fill="#0F6B58" fill-opacity="0.7" stroke="#0F6B58"/>
<text x="116" y="782" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0B4D43">4</text>
<text x="148" y="783" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#0B2B26">Name</text>
<circle cx="116" cy="832" r="16" fill="#0F6B58" fill-opacity="0.7" stroke="#0F6B58"/>
<text x="116" y="838" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0B4D43">5</text>
<text x="148" y="839" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#0B2B26">Words and style</text>
<circle cx="116" cy="888" r="16" fill="#0F6B58" fill-opacity="0.7" stroke="#0F6B58"/>
<text x="116" y="894" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0B4D43">6</text>
<text x="148" y="895" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#0B2B26">Interactions</text>
<rect x="750" y="182" width="720" height="710" rx="68" fill="#0B4D43" fill-opacity="0.028"/>
<rect x="762" y="194" width="696" height="686" rx="56" fill="#0B4D43" fill-opacity="0.044"/>
<rect x="772" y="204" width="676" height="666" rx="46" fill="#0B4D43" fill-opacity="0.064"/>
<rect id="tablet-5" x="780" y="190" width="660" height="650" rx="38" fill="#FFFFFF" stroke="#C5DDD4" stroke-width="2"/>
<g id="screen-5"><rect x="794" y="204" width="632" height="622" rx="26" fill="#FFFFFF" stroke="#0F6B58" stroke-width="2.5" stroke-dasharray="12 9"/>
<text x="1110.0" y="503.0" font-family="Sora, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="1" fill="#0B4D43">SCREEN 5</text>
<text x="1110.0" y="544.4" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0B4D43">Setup, with its live preview</text>
<text x="1110.0" y="575.9" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#0B4D43">Words and style: icon, title, subtitle</text>
<text x="1110.0" y="607.4" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0B4D43" fill-opacity="0.8">632 x 622 px (capture at 2x)</text>
